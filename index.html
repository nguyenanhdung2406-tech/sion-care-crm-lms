<script>
const KEY='sion-care-v1';
const seed={members:[{id:'td001',name:'Nguyễn Minh An',msss:'SION-2026-001',kvt:'KVT Trần Hà',stage:'TĐM',status:'Đang đồng hành',job:'Nhân viên văn phòng • Gia đình trẻ',faith:'Đang hình thành',bible:'Đang hình thành',tp:'Chưa đủ dữ liệu',prayer:'Đang hình thành',strengths:['Cởi mở','Ham học'],obstacles:['Thiếu thời gian'],needs:'Cần hình thành thói quen học và thực hành.',surveyDone:true,progress:42,gaps:[{id:'g1',title:'Tìm hiểu tình hình TP',priority:'Trung bình',status:'TODO'}],tasks:[{id:'t1',title:'Trao đổi 1-1 và xác minh dữ liệu Baseline',status:'IN_PROGRESS',due:'2026-10-10'}],history:[{date:'06/10/2026',text:'Tạo hồ sơ Thánh đồ'},{date:'07/10/2026',text:'Hoàn thành khảo sát và tạo Baseline'}]},{id:'td002',name:'Lê Gia Hân',msss:'SION-2026-002',kvt:'KVT Nguyễn Linh',stage:'TĐM',status:'Cần chăm sóc',job:'Kinh doanh',faith:'Cần xác minh',bible:'Chưa biết',tp:'Chưa biết',prayer:'Chưa biết',strengths:[],obstacles:['Lịch làm việc'],needs:'',surveyDone:false,progress:18,gaps:[],tasks:[],history:[{date:'07/10/2026',text:'Tạo hồ sơ Thánh đồ'}]}],modules:[{id:'m1',name:'Nền tảng đời sống mới',objective:'Hình thành nền tảng nhận biết, học và thực hành.',status:'PUBLISHED',lessons:[{id:'l1',title:'Vì sao cần học Lời Chúa?',content:'Giúp người học hiểu mục đích của việc học và áp dụng Lời Chúa.',practice:'Chọn một khung giờ cố định và ghi lại 1 điều học được.'},{id:'l2',title:'Thiết lập thói quen cầu nguyện',content:'Nhận biết cầu nguyện là mối liên hệ chủ động với Đức Chúa Trời.',practice:'Thực hành 10 phút mỗi ngày trong 7 ngày.'}]},{id:'m2',name:'Sinh hoạt đức tin',objective:'Xây dựng nhịp sống học Kinh Thánh, TP và cầu nguyện.',status:'DRAFT',lessons:[]} ]};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
let page='dashboard',selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>e.innerHTML='',2600)}
function go(p,id=null){page=p;if(id)selected=id;render()}
function badge(t,c='green'){return '<span class="badge '+(c==='green'?'':c)+'">'+esc(t)+'</span>'}
function card(title,sub,body){return '<div class="card"><div class="cardhead"><div class="cardtitle">'+esc(title)+'</div>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+body+'</div>'}
function attention(ms){return ms.flatMap(m=>m.gaps||[]).map(g=>'<div class="attentionrow"><div class="alerticon">!</div><div><b>'+esc(g.title)+'</b><small>'+esc(g.priority)+' • '+esc(g.status)+'</small></div>'+badge('Cần xác minh','gold')+'</div>').join('')||'<div class="empty">Chưa có việc cần tìm hiểu.</div>'}
function nav(){return '<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">S</div><div><b>SION CARE</b><small>CRM • LMS • DEVELOPMENT</small></div><button class="iconbtn mobileclose" onclick="toggleSide()">×</button></div><div class="navsection">QUẢN TRỊ</div>'+[['dashboard','⌂','Tổng quan'],['members','◉','Thánh đồ'],['education','▤','Kho giáo dục'],['assessment','✓','Đánh giá'],['settings','⚙','Thiết lập']].map(x=>'<button class="navitem '+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\');toggleSide(false)"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'<div class="navsection">PHÁT TRIỂN</div><button class="navitem '+(page==='education'?'active':'')+'" onclick="go(\'education\')"><span>↗</span>Chương trình giáo dục</button><div class="sidebarbottom"><div class="avatar">AD</div><div><b>Adam Dũng</b><small>ADMIN • V1 PILOT</small></div></div></aside>'}
function shell(){document.getElementById('app').innerHTML=nav()+'<main class="main"><header><div class="headright"><button class="iconbtn menubtn" onclick="toggleSide()">☰</button><div><div class="eyebrow">SION CARE / '+esc(page.toUpperCase())+'</div><h1>'+({dashboard:'Tổng quan',members:'Danh sách Thánh đồ',member:'Hồ sơ 360°',survey:'Khảo sát đánh giá',baseline:'Tổng hợp tình trạng',education:'Kho giáo dục',assessment:'Đánh giá lại',settings:'Thiết lập'}[page]||'SION CARE')+'</h1></div></div><div class="headright"><span class="mode"><span class="dot"></span>V1 Pilot</span><div class="avatar">AD</div></div></header><section class="content">'+renderPage()+'</section></main>'}
function render(){shell()}
function dashboard(){const n=state.members.length, done=state.members.filter(m=>m.surveyDone).length, gap=state.members.reduce((a,m)=>a+(m.gaps?.filter(g=>g.status!=='DONE').length||0),0), tasks=state.members.reduce((a,m)=>a+(m.tasks?.filter(t=>t.status!=='COMPLETED').length||0),0);return '<div class="hero"><div><span class="kicker">SION CARE • CRM • LMS • DEVELOPMENT</span><h2>Quản trị chăm sóc & phát triển Thánh đồ</h2><p>V1 tập trung vào một vòng lặp rõ ràng: tiếp nhận → khảo sát → Baseline → GAP → giáo dục → thực hành → đánh giá lại.</p></div><button class="primary" onclick="go(\'create\')">+ Tạo Thánh đồ</button></div><div class="stats"><div class="stat"><div class="staticon">◉</div><div><b>'+n+'</b><span>Thánh đồ</span></div></div><div class="stat"><div class="staticon">✓</div><div><b>'+done+'</b><span>Đã khảo sát</span></div></div><div class="stat"><div class="staticon">!</div><div><b>'+gap+'</b><span>GAP cần xử lý</span></div></div><div class="stat"><div class="staticon">◷</div><div><b>'+tasks+'</b><span>Nhiệm vụ mở</span></div></div></div><div class="grid2">'+card('Luồng phát triển','V1', '<div class="flow">'+['Tiếp nhận','Khảo sát','Baseline','GAP','Giáo dục','Thực hành','Đánh giá lại'].map((x,i)=>'<div class="flowstep"><span>0'+(i+1)+'</span><b>'+x+'</b></div>').join('')+'</div>')+card('Cần chú ý','Hôm nay',attention(state.members))+'</div><div class="grid2">'+card('Thánh đồ gần đây','',state.members.slice(0,4).map(m=>'<div class="attentionrow"><div class="avatar">'+esc(m.name[0])+'</div><div><b>'+esc(m.name)+'</b><small>'+esc(m.msss)+' • '+esc(m.kvt)+'</small></div>'+badge(m.status,m.status==='Cần chăm sóc'?'red':'green')+'</div>').join(''))+card('Nguyên tắc cốt lõi','', '<div class="rules"><div>✓ <span><b>Không biết thì không đoán.</b><small>Để trống và tạo cơ chế xác minh.</small></span></div><div>✓ <span><b>Baseline không quyết định Stage.</b><small>Stage và workflow là hệ thống khóa.</small></span></div><div>✓ <span><b>Nội dung giáo dục là nội dung mở.</b><small>Có thể chỉnh module, bài học, tài liệu và bài tập.</small></span></div></div>')+'</div>'}
function members(){return '<div class="toolbar"><div><span class="kicker">CRM • THÁNH ĐỒ</span><h2 style="margin:7px 0">Danh sách Thánh đồ</h2></div><button class="primary" onclick="go(\'create\')">+ Tạo Thánh đồ</button></div><div class="tablecard"><table><thead><tr><th>Thánh đồ</th><th>MSSS</th><th>KVT</th><th>Stage</th><th>Tiến độ</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+state.members.map(m=>'<tr><td><b>'+esc(m.name)+'</b><small>'+esc(m.job)+'</small></td><td class="mono">'+esc(m.msss)+'</td><td>'+esc(m.kvt)+'</td><td>'+badge(m.stage)+'</td><td><span class="progress"><i style="width:'+m.progress+'%"></i></span>'+m.progress+'%</td><td>'+badge(m.status,m.status==='Cần chăm sóc'?'red':'green')+'</td><td><button class="secondary small" onclick="go(\'member\',\''+m.id+'\')">Mở hồ sơ</button></td></tr>').join('')+'</tbody></table></div>'}
function create(){return '<button class="back" onclick="go(\'members\')">← Danh sách Thánh đồ</button><div class="formpage"><div class="sectionintro"><span class="kicker">INTAKE • TẠO THÁNH ĐỒ</span><h2>Tạo hồ sơ mới</h2><p>MSSS được hệ thống cấp tự động. KVT có thể bổ sung dữ liệu tiếp nhận ngay khi có.</p></div>'+card('Thông tin cơ bản','', '<div class="formgrid"><label class="field"><span>Họ và tên</span><input id="newname" placeholder="Nguyễn Văn A"></label><label class="field"><span>KVT / Người chăm sóc</span><input id="newkvt" placeholder="Tên KVT"></label><label class="field"><span>Công việc / hoàn cảnh</span><input id="newjob" placeholder="Thông tin đã biết"></label><label class="field"><span>Trạng thái ban đầu</span><select id="newstatus"><option>Đang đồng hành</option><option>Cần chăm sóc</option><option>Đang đánh giá</option></select></label></div>')+card('Nguyên tắc khảo sát','', '<div class="info"><b>Đã biết → ghi nhận.</b> Chưa biết → để trống. Chưa chắc → đánh dấu cần xác minh. Không đoán thay dữ liệu thực tế.</div>')+'<div class="stickyactions"><button class="secondary" onclick="go(\'members\')">Hủy</button><button class="primary" onclick="createMember()">✓ Tạo hồ sơ</button></div></div>'}
function createMember(){const name=document.getElementById('newname').value.trim();if(!name){toast('Vui lòng nhập họ và tên');return}const m={id:'td'+Date.now(),name,msss:'SION-'+new Date().getFullYear()+'-'+String(state.members.length+1).padStart(3,'0'),kvt:document.getElementById('newkvt').value||'Chưa phân công',stage:'TĐM',status:document.getElementById('newstatus').value,job:document.getElementById('newjob').value,faith:'Chưa biết',bible:'Chưa biết',tp:'Chưa biết',prayer:'Chưa biết',strengths:[],obstacles:[],needs:'',surveyDone:false,gaps:[],tasks:[],progress:0,history:[{date:new Date().toLocaleDateString('vi-VN'),text:'Tạo hồ sơ Thánh đồ'}]};state.members.unshift(m);save();selected=m.id;page='member';shell();toast('Đã tạo hồ sơ và cấp MSSS tự động')}
function current(){return state.members.find(m=>m.id===selected)}
function profile(){const m=current();if(!m)return go('members');return '<button class="back" onclick="go(\'members\')">← Danh sách Thánh đồ</button><div class="profilehero"><div class="avatar" style="width:56px;height:56px;font-size:22px">'+esc(m.name[0])+'</div><div class="profiletitle"><div class="eyebrow">'+m.msss+' • '+esc(m.kvt)+'</div><h2>'+esc(m.name)+'</h2><div class="chips">'+badge(m.stage)+' '+badge(m.status,'blue')+'</div></div><div class="profileactions"><button class="secondary" onclick="go(\'survey\')">☷ Khảo sát</button><button class="secondary" onclick="go(\'baseline\')">◎ Baseline</button><button class="primary" onclick="go(\'assessment\')">✓ Đánh giá lại</button></div></div><div class="tabs"><span class="active">Tổng quan</span><span>Baseline</span><span>GAP</span><span>Giáo dục</span><span>Nhiệm vụ</span><span>Lịch sử</span></div><div class="grid2">'+card('Tình trạng hiện tại','', '<div class="factorgrid">'+factor('Hoàn cảnh sống',m.job||'Đã biết')+factor('Tình trạng đức tin',m.faith,m.faith==='Đã biết'?'green':'gold')+factor('Học Kinh Thánh',m.bible)+factor('Tình hình TP',m.tp,m.tp.includes('Chưa')?'red':'green')+factor('Cầu nguyện',m.prayer)+factor('Nhu cầu phát triển',m.needs||'Chưa cập nhật','blue')+'</div>')+card('Việc cần tìm hiểu thêm','',attention([m]))+'</div><div class="grid2">'+card('Nhiệm vụ đang theo dõi','',m.tasks.length?m.tasks.map(t=>'<div class="task"><div class="check '+(t.status==='COMPLETED'?'done':'')+'">'+(t.status==='COMPLETED'?'✓':'◷')+'</div><div><b>'+esc(t.title)+'</b><small>Hạn '+esc(t.due)+'</small></div>'+badge(t.status,t.status==='COMPLETED'?'green':t.status==='IN_PROGRESS'?'blue':'gold')+'</div>').join(''):'<div class="empty">Chưa có nhiệm vụ</div>')+card('Timeline','',m.history.map(h=>'<div class="timelineitem"><span></span><div><b>'+esc(h.text)+'</b><small>'+esc(h.date)+'</small></div></div>').join(''))+'</div>'}
function factor(n,v,t='green'){return '<div class="factor"><span>'+esc(n)+'</span>'+badge(v,t)+'</div>'}
function survey(){const m=current();return '<button class="back" onclick="go(\'member\')">← Quay lại hồ sơ</button><div class="formpage"><div class="sectionintro"><span class="kicker">KHẢO SÁT • '+m.msss+'</span><h2>Khảo sát đánh giá toàn diện</h2><p>Đã biết → ghi nhận. Chưa biết → để trống. Chưa chắc → đánh dấu cần xác minh.</p></div>'+card('1. Hoàn cảnh sống','', '<div class="info">'+esc(m.job||'Chưa cập nhật')+' • dữ liệu tiếp nhận đã có</div>')+card('2. Tình trạng đức tin','', '<label class="field"><span>Tình trạng hiện tại</span><select id="faith"><option>Đã biết</option><option>Cần xác minh</option><option>Chưa biết</option></select></label>')+card('3. Sinh hoạt đức tin','', '<div class="formgrid"><label class="field"><span>Thời gian học Kinh Thánh</span><select id="bible"><option>Đã biết</option><option>Đang hình thành</option><option>Chưa đủ dữ liệu</option><option>Chưa biết</option></select></label><label class="field"><span>Tình hình TP</span><select id="tp"><option>Đã biết</option><option>Đang theo dõi</option><option>Chưa đủ dữ liệu</option><option>Chưa biết</option></select></label><label class="field"><span>Cầu nguyện</span><select id="prayer"><option>Đã biết</option><option>Ổn định</option><option>Đang hình thành</option><option>Chưa biết</option></select></label></div>')+card('4. Điểm mạnh','', '<label class="field"><span>Tối đa 3, ngăn cách bằng dấu phẩy</span><input id="strengths" value="'+esc(m.strengths.join(', '))+'"></label>')+card('5. Trở ngại','', '<label class="field"><span>Tối đa 3, ngăn cách bằng dấu phẩy</span><input id="obstacles" value="'+esc(m.obstacles.join(', '))+'"></label>')+card('6. Nhu cầu phát triển','', '<label class="field"><span>Điều người này cần nhất lúc này</span><textarea id="needs" rows="4">'+esc(m.needs)+'</textarea></label>')+'<div class="stickyactions"><button class="secondary" onclick="go(\'member\')">Hủy</button><button class="primary" onclick="saveSurvey()">✓ Lưu khảo sát</button></div></div>'}
function setVal(id,v){const e=document.getElementById(id);if(e)e.value=v}
function saveSurvey(){const m=current();const f={faith:document.getElementById('faith').value,bible:document.getElementById('bible').value,tp:document.getElementById('tp').value,prayer:document.getElementById('prayer').value,strengths:document.getElementById('strengths').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,3),obstacles:document.getElementById('obstacles').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,3),needs:document.getElementById('needs').value};m.faith=f.faith;m.bible=f.bible;m.tp=f.tp;m.prayer=f.prayer;m.strengths=f.strengths;m.obstacles=f.obstacles;m.needs=f.needs;m.surveyDone=true;m.progress=Math.max(m.progress,25);m.gaps=[];if(f.faith!=='Đã biết')m.gaps.push({id:'g'+Date.now(),title:'Xác minh tình trạng đức tin',priority:'Cao',status:'TODO'});if(f.tp.includes('Chưa'))m.gaps.push({id:'g'+(Date.now()+1),title:'Tìm hiểu tình hình TP',priority:'Trung bình',status:'TODO'});m.history.push({date:new Date().toLocaleDateString('vi-VN'),text:'Cập nhật khảo sát và tạo Baseline'});save();go('member');toast('Đã lưu khảo sát và cập nhật GAP')}
function baseline(){const m=current();return '<button class="back" onclick="go(\'member\')">← Quay lại hồ sơ</button><div class="sectionintro"><span class="kicker">BASELINE • '+m.msss+'</span><h2>Tổng hợp tình trạng</h2><p>Baseline là ảnh chụp tình trạng hiện tại, không phải quyết định Stage tự động.</p></div><div class="grid2">'+card('6 yếu tố cốt lõi','', '<div class="factorgrid">'+factor('Tình trạng đức tin',m.faith,m.faith.includes('Chưa')||m.faith.includes('Cần')?'gold':'green')+factor('Học Kinh Thánh',m.bible)+factor('Tình hình TP',m.tp,m.tp.includes('Chưa')?'gold':'green')+factor('Cầu nguyện',m.prayer)+factor('Điểm mạnh',m.strengths.join(', ')||'Chưa biết','blue')+factor('Trở ngại',m.obstacles.join(', ')||'Chưa biết','blue')+'</div>')+card('GAP & việc cần tìm hiểu','',attention([m])+'<button class="primary full" onclick="createGapTask()">+ Tạo việc cần tìm hiểu</button>')+'</div>'+card('Ghi chú KVT','', '<textarea rows="5" placeholder="Ghi nhận quan sát, điều cần xác minh..."></textarea>')}
function createGapTask(){const m=current();m.tasks.push({id:'t'+Date.now(),title:'Trao đổi 1-1 và xác minh dữ liệu Baseline',status:'TODO',due:'2026-10-14'});m.progress=Math.max(m.progress,35);m.history.push({date:new Date().toLocaleDateString('vi-VN'),text:'Tạo việc cần tìm hiểu từ Baseline'});save();go('member');toast('Đã tạo việc cần tìm hiểu')}
function education(){return '<div class="toolbar"><div><span class="kicker">NỘI DUNG MỞ</span><h2 style="margin:7px 0">Kho giáo dục</h2></div><button class="primary" onclick="addModule()">+ Thêm module</button></div><div class="educationgrid">'+state.modules.map(m=>'<div class="modulecard"><div class="modulehead"><div class="moduleicon">▤</div><div><h3>'+esc(m.name)+'</h3><small>'+m.lessons.length+' bài học • '+esc(m.status)+'</small></div></div><p>'+esc(m.objective)+'</p>'+m.lessons.map(l=>'<button class="lesson" onclick="lessonModal(\''+l.id+'\')"><div><b>'+esc(l.title)+'</b><small>'+esc(l.practice)+'</small></div><b>›</b></button>').join('')||'<div class="emptybox">Chưa có bài học.</div>'+'</div>').join('')+'</div>'}
function addModule(){state.modules.push({id:'mod'+Date.now(),name:'Module mới',objective:'Nhập mục tiêu giáo dục',status:'DRAFT',lessons:[]});save();render();toast('Đã tạo module mới')}
function lessonModal(id){const l=state.modules.flatMap(m=>m.lessons).find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend','<div class="overlay" id="modal"><div class="modal"><div class="modalhead"><h3>'+esc(l.title)+'</h3><button class="iconbtn" onclick="closeModal()">×</button></div><div class="info"><b>Mục tiêu</b><br>'+esc(l.content)+'</div><h4>Thực hành</h4><p>'+esc(l.practice)+'</p><div class="modalactions"><button class="primary" onclick="closeModal()">Đóng</button></div></div></div>')}
function closeModal(){const e=document.getElementById('modal');if(e)e.remove()}
function assessment(){return '<div class="sectionintro"><span class="kicker">ASSESSMENT</span><h2>Đánh giá lại</h2><p>So sánh trước/sau và xác định GAP tiếp theo. Stage không tự động thay đổi.</p></div><div class="tablecard"><table><thead><tr><th>Thánh đồ</th><th>Stage</th><th>Tiến độ</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+state.members.map(m=>'<tr><td><b>'+esc(m.name)+'</b><small>'+m.msss+'</small></td><td>'+badge(m.stage)+'</td><td>'+m.progress+'%</td><td>'+badge(m.status,m.status==='Đang đánh giá'?'gold':'green')+'</td><td><button class="secondary small" onclick="go(\'member\',\''+m.id+'\')">Mở hồ sơ</button></td></tr>').join('')+'</tbody></table></div>'}
function settings(){return '<div class="grid2">'+card('Quyền hạn','', '<div class="perm"><div><b>ADMIN</b><span>Toàn quyền quản trị</span></div><div><b>KVT</b><span>Quản lý người được phân công</span></div><div><b>VIEWER</b><span>Chỉ xem dữ liệu được cấp quyền</span></div></div>')+card('Nguyên tắc hệ thống','', '<div class="rules"><div>✓ <span><b>Hệ thống khóa</b><small>Stage • Workflow • Quyền • KPI • Logic đánh giá</small></span></div><div>▤ <span><b>Nội dung mở</b><small>Module • Bài học • Video • Tài liệu • Câu hỏi • Bài tập</small></span></div><div>↺ <span><b>Audit</b><small>Mọi chỉnh sửa quan trọng đều cần lưu lịch sử.</small></span></div></div>')+'</div><div style="margin-top:16px">'+card('Trạng thái V1','', '<div class="checklist"><span>CRUD Thánh đồ + MSSS</span><span>Khảo sát → Baseline → GAP</span><span>Kho giáo dục</span><span>Assignment tracking</span><span>Đánh giá lại</span><span>Dữ liệu localStorage</span></div>')+'</div>'}
function renderPage(){return page==='dashboard'?dashboard():page==='members'?members():page==='create'?create():page==='member'?profile():page==='survey'?survey():page==='baseline'?baseline():page==='education'?education():page==='assessment'?assessment():page==='settings'?settings():dashboard()}
function toggleSide(v){const s=document.getElementById('sidebar');if(!s)return;s.classList.toggle('open',v===undefined?!s.classList.contains('open'):v)}
shell();
</script>
</body>
</html>
